{% extends "document_toolkit/toolkit_base.html" %}

{% block tool_form %}

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">{{ form.title.label }}</label>
        {{ form.title }}
    </div>

    <div class="mb-3">
        <label class="form-label">Notes</label>
        {{ form.body_text }}
        {% if form.body_text.errors %}
            <div class="text-danger small mt-1">{{ form.body_text.errors.0 }}</div>
        {% endif %}
    </div>

    <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-file-earmark-plus"></i> Create PDF
    </button>

</form>

{% endblock %}

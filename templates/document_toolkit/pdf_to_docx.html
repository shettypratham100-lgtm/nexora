{% extends "document_toolkit/toolkit_base.html" %}

{% block tool_form %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label class="file-dropzone mb-3">
        <input type="file" name="file" accept="application/pdf" required>
        <i class="bi bi-cloud-upload"></i>
        <div class="dropzone-title">Click or drag a PDF here</div>
        <div class="dropzone-hint">Text-based PDFs convert best. Scanned PDFs aren't OCR'd.</div>
    </label>

    <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-file-earmark-word"></i> Convert to DOCX
    </button>

</form>

{% endblock %}

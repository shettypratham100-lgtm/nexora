<!-- ================================================= -->
<!-- SHARED CONFIRM ACTION MODAL -->
<!-- ================================================= -->
<!--
    A single reusable modal, styled to match the app,
    used to replace native browser confirm() dialogs.

    Any <form data-confirm-title="..." data-confirm-message="...">
    on the page will have its submission intercepted --
    this modal pops up instead, and only submits the
    original form if the user clicks "Confirm".

    See resource_manager.js for the wiring.
-->
<!-- ================================================= -->

<div class="modal fade" id="confirmActionModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content confirm-modal-content">

            <div class="confirm-modal-header">
                <div class="confirm-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
                <h5 class="modal-title" id="confirmActionTitle">Confirm Action</h5>
            </div>

            <div class="modal-body">
                <p class="mb-0" id="confirmActionMessage">Are you sure?</p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmActionButton">
                    <i class="bi bi-trash3"></i> <span id="confirmActionButtonLabel">Confirm</span>
                </button>
            </div>

        </div>

    </div>

</div>

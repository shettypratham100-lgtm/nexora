{% extends "base.html" %}
{% load static %}

{% block title %}Check Your Email{% endblock %}

{% block content %}

<div class="row justify-content-center auth-page">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow">

            <div class="card-body p-4 text-center">

                <img src="{% static 'images/logo.png' %}" alt="Nexora" class="auth-logo">

                <i class="bi bi-envelope-check" style="font-size: 2.5rem; color: var(--violet-600);"></i>

                <h2 class="mb-3 mt-2">Check Your Email</h2>

                <p class="text-muted mb-4">
                    If an account exists with that email address, we've sent a link to reset your password.
                    The link will expire in a few hours for security.
                </p>

                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Back to Login</a>

            </div>

        </div>

    </div>

</div>

{% endblock %}

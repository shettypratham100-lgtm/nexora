{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}

<div class="row justify-content-center auth-page">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow">

            <div class="card-body p-4 text-center">

                <img src="{% static 'images/logo.png' %}" alt="Nexora" class="auth-logo">

                <i class="bi bi-check-circle" style="font-size: 2.5rem; color: var(--teal-500);"></i>

                <h2 class="mb-3 mt-2">Password Reset!</h2>

                <p class="text-muted mb-4">
                    Your password has been changed successfully. You can now log in with your new password.
                </p>

                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Go to Login</a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
